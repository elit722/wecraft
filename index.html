<!DOCTYPE html>
<html lang="fr" data-theme="starlight">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WeCraft — Accueil</title>
<meta name="description" content="Base du site WeCraft : navigation, thème visuel et structure prêts pour les futurs systèmes de vidéo, de recommandation et de calendrier." />
<link rel="icon" type="image/png" href="assets/logo.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/sections.css" />
</head>
<body>

<canvas id="starfield" aria-hidden="true"></canvas>

<aside class="sidebar" aria-label="Navigation principale">
  <div class="sidebar__brand">
    <img src="assets/logo.png" alt="WeCraft" />
  </div>

  <nav class="sidebar__nav">
    <button class="nav-btn" data-section="search" aria-current="false">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
      <span class="nav-btn__label">Recherche</span>
    </button>
    <button class="nav-btn" data-section="home" aria-current="page">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7" /><path d="M5 10v10h14V10" /></svg>
      <span class="nav-btn__label">Accueil</span>
    </button>
    <button class="nav-btn" data-section="calendar" aria-current="false">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
      <span class="nav-btn__label">Calendrier</span>
    </button>
  </nav>

  <div class="sidebar__spacer"></div>

  <div class="sidebar__theme-hook" title="Choix du thème — à venir">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 3a9 9 0 0 0 0 18z" /></svg>
  </div>
</aside>

<div class="app-shell">
  <header class="topbar">
    <span class="topbar__wordmark">WE<span>CRAFT</span></span>

    <div class="profile">
      <button class="profile-btn" type="button">
        <span class="profile-btn__avatar">E</span>
        <svg class="profile-btn__chevron" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4" /></svg>
      </button>
      <div class="profile-menu">
        <a href="#">Mon profil</a>
        <a href="#">Paramètres</a>
        <hr />
        <a href="#">Déconnexion</a>
      </div>
    </div>
  </header>

  <main id="app-content" class="is-loading" aria-live="polite"></main>
</div>

<script src="js/theme.js"></script>
<script src="js/starfield.js"></script>
<script src="js/app.js"></script>
</body>
</html>
