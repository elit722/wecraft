<!DOCTYPE html>
<html lang="fr" data-theme="ciel-etoile">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WECRAFT — Calendrier</title>
<link rel="icon" href="assets/logo.png" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="calendar">

<div class="wc-starfield"></div>

<aside class="wc-sidebar">
  <div class="wc-sidebar__logo">
    <img src="assets/logo.png" alt="WECRAFT" />
  </div>
  <nav class="wc-sidebar__nav">
    <a class="wc-navbtn" data-page="search" href="search.html" aria-label="Recherche">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span class="wc-navbtn__label">Recherche</span>
    </a>
    <a class="wc-navbtn" data-page="home" href="index.html" aria-label="Accueil">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      <span class="wc-navbtn__label">Accueil</span>
    </a>
    <a class="wc-navbtn" data-page="calendar" href="calendar.html" aria-label="Calendrier">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span class="wc-navbtn__label">Calendrier</span>
    </a>
  </nav>
  <div class="wc-sidebar__spacer"></div>
  <a class="wc-navbtn" href="#" aria-label="Ajouter">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span class="wc-navbtn__label">Ajouter</span>
  </a>
</aside>

<header class="wc-topbar">
  <span class="wc-topbar__brandword">WECRAFT</span>
  <a class="wc-profile" data-page="profile" href="profile.html" aria-label="Profil">
    <span class="wc-profile__avatar">A</span>
    <span class="wc-profile__name">Alex</span>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </a>
</header>

<main class="wc-main">
  <section class="wc-page">
    <h1 class="wc-page__title">Calendrier</h1>
    <p class="wc-page__desc">
      Suivez ici les sorties à venir, rappels et diffusions programmées.
    </p>

    <div class="wc-calendar">
      <div class="wc-calendar__head">
        <h2>Août 2026</h2>
        <div class="wc-calendar__nav">
          <button aria-label="Mois précédent">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button aria-label="Mois suivant">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
      </div>

      <div class="wc-calendar__grid">
        <div class="wc-calendar__dow">Lun</div>
        <div class="wc-calendar__dow">Mar</div>
        <div class="wc-calendar__dow">Mer</div>
        <div class="wc-calendar__dow">Jeu</div>
        <div class="wc-calendar__dow">Ven</div>
        <div class="wc-calendar__dow">Sam</div>
        <div class="wc-calendar__dow">Dim</div>

        <!-- Semaine 1 -->
        <div class="wc-calendar__cell is-muted"></div>
        <div class="wc-calendar__cell is-muted"></div>
        <div class="wc-calendar__cell is-muted"></div>
        <div class="wc-calendar__cell is-muted"></div>
        <div class="wc-calendar__cell is-muted"></div>
        <div class="wc-calendar__cell">1</div>
        <div class="wc-calendar__cell">2</div>

        <!-- Semaine 2 -->
        <div class="wc-calendar__cell">3</div>
        <div class="wc-calendar__cell">4</div>
        <div class="wc-calendar__cell">5</div>
        <div class="wc-calendar__cell">6</div>
        <div class="wc-calendar__cell">7</div>
        <div class="wc-calendar__cell">8</div>
        <div class="wc-calendar__cell">9</div>

        <!-- Semaine 3 -->
        <div class="wc-calendar__cell">10</div>
        <div class="wc-calendar__cell">11</div>
        <div class="wc-calendar__cell">12</div>
        <div class="wc-calendar__cell is-today">
          13
          <span class="wc-calendar__dot">Aujourd'hui</span>
        </div>
        <div class="wc-calendar__cell">14</div>
        <div class="wc-calendar__cell">15</div>
        <div class="wc-calendar__cell">16</div>

        <!-- Semaine 4 -->
        <div class="wc-calendar__cell">17</div>
        <div class="wc-calendar__cell">18</div>
        <div class="wc-calendar__cell">19</div>
        <div class="wc-calendar__cell">20</div>
        <div class="wc-calendar__cell">21</div>
        <div class="wc-calendar__cell">22</div>
        <div class="wc-calendar__cell">23</div>

        <!-- Semaine 5 -->
        <div class="wc-calendar__cell">24</div>
        <div class="wc-calendar__cell">25</div>
        <div class="wc-calendar__cell">26</div>
        <div class="wc-calendar__cell">27</div>
        <div class="wc-calendar__cell">28</div>
        <div class="wc-calendar__cell">29</div>
        <div class="wc-calendar__cell">30</div>

        <!-- Semaine 6 -->
        <div class="wc-calendar__cell">31</div>
        <div class="wc-calendar__cell is-muted"></div>
        <div class="wc-calendar__cell is-muted"></div>
        <div class="wc-calendar__cell is-muted"></div>
        <div class="wc-calendar__cell is-muted"></div>
        <div class="wc-calendar__cell is-muted"></div>
        <div class="wc-calendar__cell is-muted"></div>
      </div>
    </div>
  </section>
</main>

<script src="js/main.js"></script>
</body>
</html>
