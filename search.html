<!DOCTYPE html>
<html lang="fr" data-theme="ciel-etoile">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WECRAFT — Recherche</title>
<link rel="icon" href="assets/logo.png" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="search">

<div class="wc-starfield"></div>

<aside class="wc-sidebar">
  <div class="wc-sidebar__logo">
    <img src="assets/logo.png" alt="WECRAFT" />
  </div>
  <nav class="wc-sidebar__nav">
    <a class="wc-navbtn" data-page="search" href="search.html" aria-label="Recherche">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span class="wc-navbtn__label">Recherche</span>
    </a>
    <a class="wc-navbtn" data-page="home" href="index.html" aria-label="Accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      <span class="wc-navbtn__label">Accueil</span>
    </a>
    <a class="wc-navbtn" data-page="calendar" href="calendar.html" aria-label="Calendrier">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span class="wc-navbtn__label">Calendrier</span>
    </a>
  </nav>
  <div class="wc-sidebar__spacer"></div>
  <a class="wc-navbtn" href="#" aria-label="Ajouter">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span class="wc-navbtn__label">Ajouter</span>
  </a>
</aside>

<header class="wc-topbar">
  <span class="wc-topbar__brandword">WECRAFT</span>
  <a class="wc-profile" data-page="profile" href="profile.html" aria-label="Profil">
    <span class="wc-profile__avatar">A</span>
    <span class="wc-profile__name">Alex</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </a>
</header>

<main class="wc-main">
  <section class="wc-page">
    <h1 class="wc-page__title">Recherche</h1>
    <p class="wc-page__desc">
      Cette page accueillera le futur système de recherche vidéo/streaming :
      recherche en direct, filtres par catégorie et résultats en grille.
    </p>

    <label class="wc-searchbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" placeholder="Titres, genres, créateurs…" aria-label="Rechercher" />
    </label>

    <div class="wc-chip-row" role="group" aria-label="Filtres">
      <button class="wc-chip is-active">Tout</button>
      <button class="wc-chip">Séries</button>
      <button class="wc-chip">Films</button>
      <button class="wc-chip">En direct</button>
      <button class="wc-chip">Nouveautés</button>
    </div>

    <div class="wc-empty">
      Les résultats de recherche s'afficheront ici une fois le catalogue vidéo connecté.
    </div>
  </section>
</main>

<script src="js/main.js"></script>
</body>
</html>
